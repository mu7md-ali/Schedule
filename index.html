<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Shorouk Schedule</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header>
    <h1>CS Shorouk Schedule</h1>

    <div class="header-buttons">
        <button onclick="toggleTheme()">Toggle Mode</button>

        <a href="https://elearning.sha.edu.eg/"
           target="_blank"
           rel="noopener noreferrer"
           class="elearning-btn">
            E-Learning
        </a>
    </div>
</header>

<div class="controls">
    <button onclick="enableEditing()">Designer Mode</button>
    <button onclick="downloadGroupPDF()">Download PDF</button>
    <button onclick="openNotesModal()">Notes</button>
</div>

<div id="captureArea">
    <div id="scheduleContainer"></div>
</div>

<div class="bottom-download">
    <button onclick="downloadTable()">Save as Image</button>
</div>

<!-- Notes Modal -->
<div id="notesModal" class="modal">
    <div class="modal-content">
        <h3>Notes</h3>
        <textarea id="notesArea"></textarea>
        <button onclick="saveNotes()">Save</button>
        <button onclick="closeNotesModal()">Close</button>
    </div>
</div>

<script src="script.js"></script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
